# Denni tipy -- beh agenta na serverech GitHubu, bez zapnuteho pocitace.
#
# Kdy se spousti:
#
#   1) HLAVNE externe v 8:00 -- sluzba cron-job.org zavola GitHub API
#      (workflow_dispatch) a beh zacne behem par vterin. Postup nastaveni
#      je v README, sekce "Automaticke spousteni".
#
#   2) ZALOHA planovacem GitHubu. Ten na cas spolehnout nejde: v tomhle
#      repozitari planovane behy zpozdoval o 6-7 hodin a slucoval je do
#      jednoho. Zustava jen pro pripad, ze by selhalo externi spousteni --
#      pak zprava prijde aspon pozdeji.
#
#   Agent sam hlida, aby zprava prisla jednou denne a ne pred 7:55 v Praze
#   (GitHub nezna letni cas). Preskoceny beh skonci drive, nez sahne na API,
#   a nestoji zadne kredity The Odds API.
#
# Rucni spusteni: zalozka Actions -> Denni tipy -> Run workflow.
#   "Poslat i kdyz uz dnes zprava byla" = zapnout pro test.

name: Denni tipy

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Poslat i kdyz uz dnes zprava byla (pro test)"
        type: boolean
        default: false

# Workflow si po behu zapisuje denik tipu (tips.json) zpet do repozitare.
permissions:
  contents: write

# Nikdy dva behy najednou -- jinak by si prepisovaly denik.
concurrency:
  group: denni-tipy
  cancel-in-progress: false

jobs:
  tipy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Stahnout kod a denik tipu
        uses: actions/checkout@v5

      - name: Pripravit Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Nainstalovat knihovny
        run: pip install -r requirements.txt

      - name: Spustit agenta
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            python main.py
          else
            python main.py --once-per-day --not-before 07:55
          fi

      - name: Ulozit denik tipu do repozitare
        run: |
          if git diff --quiet -- tips.json; then
            echo "Denik tipu se nezmenil."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tips.json
          git commit -m "Denik tipu $(TZ=Europe/Prague date +%Y-%m-%d)"
          # Kdyby mezitim nekdo upravil treba settings.env na webu.
          git pull --rebase
          git push
