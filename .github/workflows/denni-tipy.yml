# Denni tipy -- beh agenta na serverech GitHubu, bez zapnuteho pocitace.
#
# Kdy se spousti:
#
#   1) HLAVNE externe v 8:00 -- sluzba cron-job.org zavola GitHub API
#      (workflow_dispatch) a beh zacne behem par vterin. Postup nastaveni
#      je v README, sekce "Automaticke spousteni".
#
#   2) ZALOHA planovacem GitHubu. Ten na cas spolehnout nejde: v tomhle
#      repozitari planovane behy zpozdoval o 6-7 hodin a slucoval je do
#      jednoho. Zustava jen pro pripad, ze by selhalo externi spousteni --
#      pak zprava prijde aspon pozdeji.
#
#   Agent sam hlida, aby zprava prisla jednou denne a ne pred 7:55 v Praze
#   (GitHub nezna letni cas). Preskoceny beh skonci drive, nez sahne na API,
#   a nestoji zadne kredity The Odds API.
#
# Rucni spusteni: zalozka Actions -> Denni tipy -> Run workflow.
#   "Poslat i kdyz uz dnes zprava byla" = zapnout pro test.
#   "Jen zkouska" = cely beh vcetne AI debaty, ale nic neposle ani neulozi
#   (vysledek a prubeh debaty jsou jen v logu behu).

name: Denni tipy

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Poslat i kdyz uz dnes zprava byla (pro test)"
        type: boolean
        default: false
      dry_run:
        description: "Jen zkouska -- nic neposilat ani neukladat (vysledek v logu)"
        type: boolean
        default: false

# Workflow si po behu zapisuje denik tipu (tips.json) zpet do repozitare.
permissions:
  contents: write

# Nikdy dva behy najednou -- jinak by si prepisovaly denik.
concurrency:
  group: denni-tipy
  cancel-in-progress: false

jobs:
  tipy:
    runs-on: ubuntu-latest
    # AI debata (resers na webu + nekolik kol) trva par minut.
    timeout-minutes: 20

    steps:
      - name: Stahnout kod a denik tipu
        uses: actions/checkout@v5

      - name: Pripravit Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Nainstalovat knihovny
        # Balicek 'anthropic' je jen pro volitelnou AI debatu. Kdyby se ho nepodarilo
        # nainstalovat, nesmi kvuli tomu spadnout cely beh -- zprava musi prijit.
        # Agent pak AI krok preskoci (a ve zprave to rekne).
        run: |
          pip install -r requirements.txt || {
            echo "::warning::Instalace se nezdarila, zkousim bez balicku anthropic (AI krok se preskoci)."
            grep -v '^anthropic' requirements.txt > requirements-core.txt
            pip install -r requirements-core.txt
          }

      - name: Spustit agenta
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Volitelne: bez obou klicu se AI debata preskoci.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python main.py --dry-run
          elif [ "$FORCE" = "true" ]; then
            python main.py
          else
            python main.py --once-per-day --not-before 07:55
          fi

      - name: Ulozit denik tipu (a prubeh debaty) do repozitare
        run: |
          git add tips.json
          if [ -d debaty ]; then git add debaty; fi
          if git diff --cached --quiet; then
            echo "Denik tipu se nezmenil."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Denik tipu $(TZ=Europe/Prague date +%Y-%m-%d)"
          # Kdyby mezitim nekdo upravil treba settings.env na webu.
          git pull --rebase
          git push
